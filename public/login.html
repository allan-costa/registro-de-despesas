<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Registro de Despesas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-100 via-blue-50 to-sky-200 text-slate-800">
  <main class="flex min-h-screen items-center justify-center p-4">
    <div id="card-login" class="w-full max-w-sm rounded-xl border border-gray-100 bg-white p-8 shadow-sm">
      <div class="mb-6 flex flex-col items-center text-center">
        <span class="mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-white">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </span>
        <h1 class="text-xl font-semibold text-slate-800">Registro de Despesas</h1>
        <p class="mt-1 text-sm text-slate-500">Entre com a sua conta</p>
      </div>

      <form id="form-login" class="space-y-4" novalidate>
        <div>
          <label for="email" class="rotulo">E-mail</label>
          <input id="email" name="email" type="email" class="campo-input" autocomplete="username" required autofocus>
        </div>
        <div>
          <label for="senha" class="rotulo">Senha</label>
          <input id="senha" name="senha" type="password" class="campo-input" autocomplete="current-password" required>
        </div>

        <p id="erro-login" role="alert" class="hidden rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"></p>

        <button id="btn-entrar" type="submit" class="botao botao-primario w-full">Entrar</button>
      </form>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    (() => {
      // Já autenticado: segue para o dashboard. Token vencido volta pelo logout do apiFetch, sem laço.
      if (Auth.getToken()) {
        location.replace(`${window.BASE_PATH}/index.html`);
        return;
      }

      const form = document.getElementById('form-login');
      const card = document.getElementById('card-login');
      const erro = document.getElementById('erro-login');
      const botao = document.getElementById('btn-entrar');
      const campoEmail = document.getElementById('email');
      const campoSenha = document.getElementById('senha');

      function mostrarErro(mensagem) {
        erro.textContent = mensagem;
        erro.classList.remove('hidden');
        // Reinicia a animação a cada nova falha.
        card.classList.remove('animar-erro');
        void card.offsetWidth;
        card.classList.add('animar-erro');
      }

      form.addEventListener('submit', async (evento) => {
        evento.preventDefault();
        erro.classList.add('hidden');

        const email = campoEmail.value.trim();
        const senha = campoSenha.value;
        if (!email || !senha) {
          mostrarErro('Informe o e-mail e a senha.');
          (email ? campoSenha : campoEmail).focus();
          return;
        }

        botao.disabled = true;
        botao.textContent = 'Entrando…';
        try {
          const dados = await apiFetch('/api/auth/login', { method: 'POST', body: { email, senha }, publico: true });
          Auth.setSession(dados);
          location.replace(`${window.BASE_PATH}/index.html`);
        } catch (e) {
          mostrarErro(e.message);
          campoSenha.value = '';
          campoSenha.focus();
          botao.disabled = false;
          botao.textContent = 'Entrar';
        }
      });
    })();
  </script>
</body>
</html>
